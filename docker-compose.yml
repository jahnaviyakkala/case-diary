services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: case-diary-hindsight
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_API_LLM_PROVIDER:-gemini}
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_API_LLM_API_KEY:-}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_API_LLM_MODEL:-}
    volumes:
      - hindsight_data:/home/hindsight/.pg0

volumes:
  hindsight_data:
